# Keeps the free Supabase project awake, and keeps encrypted backups of it.
#
# - Every day: one small read through the public API. Supabase pauses free
#   projects after 7 days with no activity; this is activity.
# - Every Sunday (or by hand): a dump of the database (schemas public and
#   private, plus the accounts in auth), encrypted with a passphrase only
#   you know, kept as a workflow artifact for 30 days.
#
# This repository is public, so the dump is encrypted BEFORE it is uploaded
# and nothing from it is ever printed to the log. Set two repository
# secrets (Settings → Secrets and variables → Actions) to turn backups on:
#   SUPABASE_DB_URL     Supabase → Connect → "Session pooler" URI (port 5432),
#                       with your database password filled in
#   BACKUP_PASSPHRASE   a long random passphrase; keep it somewhere safe --
#                       without it the backups can't be opened
# Without them, only the daily wake-up runs. Restoring: see HOSTING.md.
#
# - Every hour: copies Supabase's logs (API requests, sign-ins, database
#   errors, file storage) into the database, where they're kept 180 days
#   for CERT-In (supabase-phase23.sql). The free plan keeps them a day.
#   Needs SUPABASE_DB_URL and one more secret:
#   SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens → Generate
#                          (read-only; it expires within 90 days: replace it)
#   Nothing from the logs is ever printed here: only counts.
name: Keep alive and back up

on:
  schedule:
    - cron: "17 3 * * *"   # every day, 03:17 UTC (wake-up)
    - cron: "41 4 * * 0"   # Sundays, 04:41 UTC (backup)
    - cron: "7 * * * *"    # every hour (security logs)
  workflow_dispatch:
    inputs:
      backup:
        description: "Also make a backup now"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  wake:
    if: github.event.schedule != '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Touch the database through the API
        env:
          URL: https://zqtvqobonmpxffjxbjpt.supabase.co
          KEY: sb_publishable_TQ1NrHUU3HaIcFRkOWXHuQ_yC3REquy # the public key the apps ship with
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/profiles?select=id&limit=1")
          echo "Supabase answered $code"
          if [ "$code" = "540" ] || [ "$code" = "503" ]; then
            echo "::error::The project looks paused. Restore it from the Supabase dashboard."
            exit 1
          fi

  backup:
    if: github.event.schedule == '41 4 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.backup)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the secrets are set
        id: check
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::warning::Backups are off: set SUPABASE_DB_URL and BACKUP_PASSPHRASE to turn them on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Postgres 17 client
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null

      - name: Dump and encrypt
        if: steps.check.outputs.ready == 'true'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          stamp=$(date -u +%Y-%m-%d)
          mkdir -p out work
          PG=/usr/lib/postgresql/17/bin
          # Your tables, functions and policies, with their data.
          "$PG/pg_dump" "$DB" --no-owner --no-privileges --schema=public --schema=private -Fc -f work/app.dump
          # Accounts (emails and password hashes), data only.
          "$PG/pg_dump" "$DB" --data-only -t auth.users -t auth.identities -Fc -f work/auth.dump
          tar -C work -cf - app.dump auth.dump \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
                  --passphrase-fd 3 3<<<"$PASS" -o "out/panalo-$stamp.tar.gpg"
          rm -rf work
          ls -la out | sed 's/^/  /'

      - name: Keep it for 30 days
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: panalo-backup
          path: out/*.tar.gpg
          retention-days: 30
          if-no-files-found: error

  logs:
    if: github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the secrets are set
        id: check
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$DB" ] || [ -z "$TOKEN" ]; then
            echo "::warning::Security logs aren't being kept: set SUPABASE_DB_URL and SUPABASE_ACCESS_TOKEN."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy the last three hours of logs into the database
        if: steps.check.outputs.ready == 'true'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: zqtvqobonmpxffjxbjpt
        run: |
          set -euo pipefail
          umask 077
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          # Three hours back, every hour: a late or skipped run loses nothing,
          # and rows already copied are ignored (same id).
          start=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # One query over Supabase's unified log table (ClickHouse SQL; the
          # old logs.all endpoint was removed on 23 Sep 2026). API requests
          # get the caller's IP address and country added; routine database
          # checkpoint and timer lines are left out.
          sql="select id, timestamp, source, if(source = 'edge_logs', concat(event_message, ' | ip ', log_attributes['request.headers.cf_connecting_ip'], ' | ', log_attributes['request.cf.country']), event_message) as event_message from logs where source in ('edge_logs', 'auth_logs', 'postgres_logs', 'storage_logs') and not (source = 'postgres_logs' and (startsWith(event_message, 'checkpoint ') or startsWith(event_message, 'cron job '))) order by timestamp desc limit 1000"
          code=$(curl -sS --max-time 60 -G -w '%{http_code}' \
               "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" \
               -H "Authorization: Bearer $TOKEN" \
               --data-urlencode "sql=$sql" \
               --data-urlencode "iso_timestamp_start=$start" \
               --data-urlencode "iso_timestamp_end=$end" \
               -o rows.json 2>/dev/null) || code=000
          if [ "$code" = 401 ] || [ "$code" = 403 ]; then
            # Tokens last 90 days at most.
            echo "::error::Supabase refused the access token (HTTP $code). It has probably expired, or lacks logs read access: make a new one (read-only is enough) and replace the SUPABASE_ACCESS_TOKEN secret."
            exit 1
          fi
          if [ "$code" != 200 ]; then
            echo "::error::Couldn't read the logs from Supabase (HTTP $code)."
            exit 1
          fi
          if ! jq -e '.result | type == "array"' rows.json >/dev/null; then
            # The query's own error, never the log contents.
            echo "::error::Supabase didn't return logs: $(jq -r '.error // "no result" | tostring' rows.json | head -c 300)"
            exit 1
          fi
          jq -c '.result' rows.json > batch.json
          got=$(jq 'length' batch.json)
          if [ "$got" -ge 1000 ]; then
            echo "::warning::1000 log lines in three hours; some may be missing. Run this job more often."
          fi
          # Read the batch from the file inside psql: no size limit, never echoed.
          stored=$(psql "$DB" -X -q -t -A -v ON_ERROR_STOP=1 <<'SQL'
          \set rows `cat batch.json`
          select private.store_logs(:'rows'::jsonb);
          SQL
          )
          echo "$got log lines read, $stored new"
          jq -r 'group_by(.source)[] | "  \(.[0].source): \(length)"' batch.json
          rm -f rows.json batch.json
